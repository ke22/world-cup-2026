<!DOCTYPE html>

<head>

<style>
/* ── CNA Design System Variables ── */
:root {
  color-scheme: light;
  --bg: #eef2f6;
  --surface: #ffffff;
  --surface-2: #f5f8fc;
  --fg: #1f2937;
  --muted: #66758a;
  --border: rgba(15, 50, 96, 0.12);
  --shadow: rgba(15, 75, 143, 0.08);
  --accent: #0f4b8f;
  --accent-2: #2c73c9;
  --header-from: #13579f;
  --header-to: #0f4b8f;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC",
    "Microsoft JhengHei", Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
  font-size: 15px;
  line-height: 1.5;
}

.wrapper { max-width: 800px; margin: 0 auto; padding: 10px; }

.panel {
  background: var(--surface);
  border-radius: 16px;
  border: 1px solid var(--border);
  box-shadow: 0 10px 30px var(--shadow);
  overflow: hidden;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  padding: 16px 18px;
  background: linear-gradient(180deg, var(--header-from) 0%, var(--header-to) 100%);
  border-radius: 16px 16px 0 0;
  gap: 12px;
}
.cna-logo { height: 24px; width: auto; filter: brightness(0) invert(1); opacity: 0.9; flex-shrink: 0; }
.header-title { font-size: 1.1rem; font-weight: 700; color: #fff; letter-spacing: 0.2px; }

/* ── Chart ── */
.chart-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 16px 8px 4px; }
.chart-scroll svg { display: block; min-width: 600px; height: auto; }

/* ── Note ── */
.note-row {
  padding: 6px 18px 14px;
  font-size: 11.5px; color: #94a3b8; line-height: 1.55;
  border-top: 1px solid var(--border);
}
#gas-error {
  display: none;
  margin: 0 18px 10px;
  padding: 8px 12px;
  background: #fff8ee;
  border: 1px solid #f59e0b;
  border-radius: 8px;
  font-size: 12px;
  color: #92400e;
}

/* ── Hover tooltip ── */
#tt {
  position: fixed;
  pointer-events: none;
  z-index: 200;
  display: none;
  background: rgba(10, 20, 45, 0.92);
  border-radius: 10px;
  padding: 10px 14px;
  min-width: 130px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.28);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.tt-name  { font-size: 13.5px; font-weight: 700; color: #fff; }
.tt-year  { font-size: 11.5px; color: rgba(255,255,255,0.62); margin-top: 2px; }
.tt-goals { font-size: 13px; font-variant-numeric: tabular-nums; color: #93c5fd; margin-top: 5px; }
.tt-sep   { width: 100%; height: 1px; background: rgba(255,255,255,0.12); margin: 6px 0; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="panel">
    <div class="header">
      <img src="cna_logo.svg" class="cna-logo" alt="CNA">
      <span class="header-title">世界盃歷史射手競賽</span>
    </div>

    <div class="chart-scroll">
      <svg id="chart" viewBox="0 0 720 440" preserveAspectRatio="xMidYMid meet"></svg>
    </div>


  </div>
</div>

<div id="tt">
  <div class="tt-name"></div>
  <div class="tt-year"></div>
  <div class="tt-sep"></div>
  <div class="tt-goals"></div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzy0JSAlS2LRpEM3bZ8xv_qYW4saN8KkKptt91IMdjnpmMWm1ZpeuVG-5Rqie5odRg19Q/exec';
const CACHE_KEY = 'wc26_scorers';
const CACHE_TTL = 60; // seconds
const LS_KEY = 'wc26_scorers_v1';

// ── Static historical data (pre-2026) ── Source: FIFA / OPTA
// active: true  → coloured line (2.5px), labels; 2026 live data appended
// active: false → muted grey reference line (1.5px, opacity 0.6)
const HISTORICAL_DATA = {
  mbappe:    { name: '姆巴佩',     flag: '🇫🇷', color: '#D32F2F', active: true,  career: [
    { wc: 2018, goals: 4 }, { wc: 2022, goals: 8 }, { wc: 2026, goals: 4 },
  ]},
  messi:     { name: '梅西',       flag: '🇦🇷', color: '#1565C0', active: true,  career: [
    { wc: 2006, goals: 1 }, { wc: 2010, goals: 0 }, { wc: 2014, goals: 4 },
    { wc: 2018, goals: 1 }, { wc: 2022, goals: 7 }, { wc: 2026, goals: 6 },
  ]},
  cronaldo:  { name: 'C羅納度',    flag: '🇵🇹', color: '#2E7D32', active: true,  career: [
    { wc: 2002, goals: 0 }, { wc: 2006, goals: 1 }, { wc: 2010, goals: 1 },
    { wc: 2014, goals: 1 }, { wc: 2018, goals: 4 }, { wc: 2022, goals: 1 }, { wc: 2026, goals: 2 },
  ]},
  kane:      { name: '凱恩',       flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿', color: '#7B1FA2', active: true,  career: [
    { wc: 2018, goals: 6 }, { wc: 2022, goals: 2 }, { wc: 2026, goals: 2 },
  ]},
  bellingham:{ name: '貝林翰',     flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿', color: '#E65100', active: true,  career: [
    { wc: 2022, goals: 1 }, { wc: 2026, goals: 4 },
  ]},
  klose:     { name: '克洛澤',     flag: '🇩🇪', color: '#b0b8c1', active: false, career: [
    { wc: 2002, goals: 5 }, { wc: 2006, goals: 5 }, { wc: 2010, goals: 4 }, { wc: 2014, goals: 2 },
  ]},
  r9ronaldo: { name: '羅納度',     flag: '🇧🇷', color: '#b0b8c1', active: false, career: [
    { wc: 1994, goals: 0 }, { wc: 1998, goals: 4 }, { wc: 2002, goals: 8 }, { wc: 2006, goals: 3 },
  ]},
  gmuller:   { name: '穆勒',       flag: '🇩🇪', color: '#b0b8c1', active: false, career: [
    { wc: 1970, goals: 10 }, { wc: 1974, goals: 4 },
  ]},
  fontaine:  { name: '方登',       flag: '🇫🇷', color: '#b0b8c1', active: false, career: [
    { wc: 1958, goals: 13 },
  ]},
  pele:      { name: '比利',       flag: '🇧🇷', color: '#b0b8c1', active: false, career: [
    { wc: 1958, goals: 6 }, { wc: 1962, goals: 1 }, { wc: 1966, goals: 1 }, { wc: 1970, goals: 4 },
  ]},
  klinsmann: { name: '克林斯曼',   flag: '🇩🇪', color: '#b0b8c1', active: false, career: [
    { wc: 1990, goals: 3 }, { wc: 1994, goals: 5 }, { wc: 1998, goals: 3 },
  ]},
  kocsis:    { name: '柯西斯',     flag: '🇭🇺', color: '#b0b8c1', active: false, career: [
    { wc: 1954, goals: 11 },
  ]},
  batistuta: { name: '巴提斯圖塔', flag: '🇦🇷', color: '#b0b8c1', active: false, career: [
    { wc: 1994, goals: 4 }, { wc: 1998, goals: 5 }, { wc: 2002, goals: 1 },
  ]},
  cubillas:  { name: '庫比利亞斯', flag: '🇵🇪', color: '#b0b8c1', active: false, career: [
    { wc: 1970, goals: 5 }, { wc: 1978, goals: 5 },
  ]},
};

// ── sessionStorage cache ──
function cacheGet(key) {
  try {
    const raw = sessionStorage.getItem(key);
    if (!raw) return null;
    const { ts, data } = JSON.parse(raw);
    if (Date.now() - ts < CACHE_TTL * 1000) return data;
    sessionStorage.removeItem(key);
    return null;
  } catch { return null; }
}

function cacheSet(key, data) {
  try {
    sessionStorage.setItem(key, JSON.stringify({ ts: Date.now(), data }));
  } catch {}
}

// ── Fetch live 2026 data ──
async function fetchTopScorers() {
  const hit = cacheGet(CACHE_KEY);
  if (hit) return hit;
  const url = GAS_URL + '?action=getTopScorers';
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (json.status !== 'ok') throw new Error(json.message || 'API error');
  cacheSet(CACHE_KEY, json.data);
  return json.data;
}

// ── Merge historical + 2026 live data ──
// Returns a new HISTORICAL_DATA-shaped object with 2026 career entry appended for active players
// player_code aliases: GAS sheet may use different codes than HISTORICAL_DATA keys
const PLAYER_CODE_ALIASES = {
  'ronaldo': 'cronaldo',  // scorers sheet uses 'ronaldo' for C. Ronaldo; HISTORICAL_DATA key is 'cronaldo'
};

function mergePlayerData(historical, live2026) {
  const merged = {};
  for (const [code, p] of Object.entries(historical)) {
    merged[code] = { ...p, career: p.career.map(t => ({ ...t })) };
  }
  for (const livePlayer of live2026) {
    const rawCode = livePlayer.player_code;
    const code = PLAYER_CODE_ALIASES[rawCode] || rawCode;
    if (!merged[code] || !merged[code].active) continue;
    if (livePlayer.matches_played_2026 > 0) {
      const entry = { wc: 2026, goals: livePlayer.total_goals_2026 };
      const idx = merged[code].career.findIndex(t => t.wc === 2026);
      if (idx >= 0) merged[code].career[idx] = entry;
      else merged[code].career.push(entry);
    }
  }
  return merged;
}

// ── Chart geometry ──
const VW = 720, VH = 440;
const ML = 48, MT = 28, MR = 105, MB = 52;
const PW = VW - ML - MR;  // 567
const PH = VH - MT - MB;  // 360
const MAX_Y = 20;

// WC years covered by the 13 displayed players (gaps where no player has data are omitted)
const WC_YEARS = [1954,1958,1962,1966,1970,1974,1978,1990,1994,1998,2002,2006,2010,2014,2018,2022,2026];
function cx_year(year) {
  const i = WC_YEARS.indexOf(year);
  return ML + (i / (WC_YEARS.length - 1)) * PW;
}
const cy = g => MT + PH - (g / MAX_Y) * PH;
const f  = n => n.toFixed(1);

// ── Build career path (step chart, year-based x-axis) ──
// pts: [[wcYear, cumGoals], ...] — converted to SVG coords in render
// dots: carry { wx, nextWx, isMid, year, cumGoals, tourGoals, isCareerStart }
//   career start & last-tournament-end → at exact WC year x (corners OK)
//   intermediate tournament ends → mid-horizontal between this WC and next WC year
function buildCareerPath(player) {
  let y = 0;
  const pts  = [];
  const dots = [];
  const tours = player.career;

  // Skip leading zero-goal WCs: start line from first scoring tournament
  const firstScoringIdx = tours.findIndex(t => t.goals > 0);
  if (firstScoringIdx < 0) return { pts: [], dots: [], endWC: tours[tours.length - 1].wc, endY: 0 };

  // No starting point at y=0 — line begins from the first goal scored
  for (let ti = firstScoringIdx; ti < tours.length; ti++) {
    const tour   = tours[ti];
    const isLast = ti === tours.length - 1;
    const goals  = tour.goals;

    if (ti > firstScoringIdx) pts.push([tour.wc, y]);
    if (goals > 0) { y += goals; pts.push([tour.wc, y]); }

    const nextWC = isLast ? null : tours[ti + 1].wc;
    dots.push({ wx: tour.wc, nextWx: nextWC, isMid: !isLast,
                year: tour.wc, cumGoals: y, tourGoals: goals, isCareerStart: false });
  }

  return { pts, dots, endWC: tours[tours.length - 1].wc, endY: y };
}

// ── Tooltip ──
const tt     = document.getElementById('tt');
const ttName = tt.querySelector('.tt-name');
const ttYear = tt.querySelector('.tt-year');
const ttGoal = tt.querySelector('.tt-goals');

function ttShow(e, dot, playerName, playerColor) {
  ttName.textContent = playerName;
  ttName.style.color = playerColor;
  if (dot.isCareerStart) {
    ttYear.textContent = dot.year ? `${dot.year} 世界盃・首登場` : '生涯起點';
    ttGoal.textContent = '累計 0 球';
  } else {
    ttYear.textContent = `${dot.year} 世界盃`;
    ttGoal.textContent = `本屆 ${dot.tourGoals} 球・累計 ${dot.cumGoals} 球`;
  }
  tt.style.display = 'block';
  ttMove(e);
}
function ttMove(e) {
  const src = e.touches ? e.touches[0] : e;
  const vw = window.innerWidth, vh = window.innerHeight;
  const w = tt.offsetWidth || 170, h = tt.offsetHeight || 80;
  let left = src.clientX + 16, top = src.clientY - 12;
  if (left + w > vw - 8) left = src.clientX - w - 16;
  if (top + h > vh - 8)  top  = src.clientY - h + 12;
  tt.style.left = left + 'px';
  tt.style.top  = top  + 'px';
}
function ttHide() { tt.style.display = 'none'; }

// ── SVG helpers ──
const NS = 'http://www.w3.org/2000/svg';
function mk(tag, attrs, parent) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  parent && parent.appendChild(el);
  return el;
}
function txt(str, attrs, parent) {
  const el = mk('text', attrs, parent);
  el.textContent = str;
  return el;
}

// ── Render ──
function render(playerData) {
  const svg = document.getElementById('chart');
  svg.innerHTML = '';

  // White base + plot tint
  mk('rect', { x:0, y:0, width:VW, height:VH, fill:'#fff' }, svg);
  mk('rect', { x:ML, y:MT, width:PW, height:PH, fill:'rgba(240,244,249,0.45)', rx:2 }, svg);

  // ── Y-axis grid ──
  const gridG = mk('g', {}, svg);
  for (let g = 0; g <= 20; g += 2) {
    const y = cy(g);
    mk('line', {
      x1: ML, y1: f(y), x2: ML+PW, y2: f(y),
      stroke: g === 0 ? 'rgba(15,50,96,0.2)' : 'rgba(15,50,96,0.06)',
      'stroke-width': g === 0 ? 1.2 : 0.7,
    }, gridG);
    if (g % 4 === 0) {
      txt(String(g), {
        x: ML - 6, y: f(y + 4),
        'text-anchor': 'end', fill: '#94a3b8', 'font-size': '10.5',
        'font-variant-numeric': 'tabular-nums',
      }, gridG);
    }
  }
  // Y spine
  mk('line', { x1:ML, y1:MT, x2:ML, y2:MT+PH, stroke:'rgba(15,50,96,0.15)', 'stroke-width':1 }, gridG);
  // Y label
  txt('累計進球', {
    x: f(ML - 34), y: f(MT + PH/2),
    'text-anchor': 'middle', fill: '#b0bec5', 'font-size': '10',
    transform: `rotate(-90 ${f(ML-34)} ${f(MT+PH/2)})`,
  }, gridG);

  // ── X-axis (WC years) ──
  const axG = mk('g', {}, svg);
  for (const year of WC_YEARS) {
    const x = cx_year(year);
    // faint vertical guideline
    mk('line', { x1:f(x), y1:MT, x2:f(x), y2:MT+PH,
      stroke:'rgba(15,50,96,0.05)', 'stroke-width':0.8 }, axG);
    // tick
    mk('line', { x1:f(x), y1:MT+PH, x2:f(x), y2:MT+PH+5,
      stroke:'#cbd5e1', 'stroke-width':0.8 }, axG);
    // year label, rotated so 4-digit numbers don't collide
    const labelY = MT + PH + 14;
    const labelEl = txt(String(year), {
      x: f(x), y: labelY,
      'text-anchor': 'end', fill: '#94a3b8', 'font-size': '9.5',
      transform: `rotate(-40 ${f(x)} ${labelY})`,
    }, axG);
  }

  // ── Build paths ──
  const computed = {};
  for (const [code, p] of Object.entries(playerData)) {
    computed[code] = { ...p, ...buildCareerPath(p) };
  }

  // Render retired first (z below), active second (z above)
  // Each player gets its own sub-group within each z-layer so we can
  // dim lines + dots + labels together on hover.
  const lineG = mk('g', {}, svg);
  const dotG  = mk('g', {}, svg);
  const lblG  = mk('g', {}, svg);

  const retiredCodes = Object.keys(computed).filter(k => !computed[k].active);
  const activeCodes  = Object.keys(computed).filter(k =>  computed[k].active);

  // Per-player group registry — {code, pLineG, pDotG, pLblG}
  const allGroups = [];

  // Dim all others / restore all
  const dimOthers = exceptCode => {
    for (const pg of allGroups) {
      const dim = pg.code !== exceptCode;
      pg.pLineG.setAttribute('opacity', dim ? '0.15' : '1');
      pg.pDotG .setAttribute('opacity', dim ? '0.15' : '1');
      pg.pLblG .setAttribute('opacity', dim ? '0.15' : '1');
    }
  };
  const restoreAll = () => {
    for (const pg of allGroups) {
      pg.pLineG.setAttribute('opacity', '1');
      pg.pDotG .setAttribute('opacity', '1');
      pg.pLblG .setAttribute('opacity', '1');
    }
  };

  // Collect active player end labels; resolve Y collisions after loop
  const endLabels = [];

  for (const code of [...retiredCodes, ...activeCodes]) {
    const p = computed[code];
    const sw    = p.active ? 2.5 : 1.5;
    const op    = p.active ? 1   : 0.6;
    const dotR  = p.active ? 3.5 : 2.5;
    const haloR = p.active ? 5.5 : 4.2;

    // Per-player sub-groups (maintain z-ordering across layers)
    const pLineG = mk('g', {}, lineG);
    const pDotG  = mk('g', {}, dotG);
    const pLblG  = mk('g', {}, lblG);
    allGroups.push({ code, pLineG, pDotG, pLblG });

    // ── Single-WC players: one dot only, no polyline ──
    if (p.career.length === 1) {
      const t   = p.career[0];
      const px  = f(cx_year(t.wc));
      const py  = f(cy(t.goals));
      const dot = { wx: t.wc, nextWx: null, isMid: false, year: t.wc,
                    cumGoals: t.goals, tourGoals: t.goals, isCareerStart: false };
      mk('circle', { cx: px, cy: py, r: haloR, fill: '#fff' }, pDotG);
      mk('circle', { cx: px, cy: py, r: dotR,  fill: p.color, opacity: op }, pDotG);
      const hit = mk('circle', { cx: px, cy: py, r: 13, fill: 'transparent', style: 'cursor:pointer' }, pDotG);
      hit.addEventListener('mouseenter', e => { dimOthers(code); ttShow(e, dot, p.name, p.color); });
      hit.addEventListener('mousemove',  ttMove);
      hit.addEventListener('mouseleave', () => { restoreAll(); ttHide(); });
      hit.addEventListener('touchstart', e => { e.preventDefault(); dimOthers(code); ttShow(e, dot, p.name, p.color); }, { passive: false });
      hit.addEventListener('touchend',   () => { restoreAll(); ttHide(); });
      txt(`${p.flag} ${p.name}  ${t.goals}`, {
        x: f(cx_year(t.wc)), y: f(cy(t.goals) - 10),
        'text-anchor': 'middle', fill: '#64748b',
        'font-size': '11.5', 'font-weight': '400',
        stroke: 'rgba(255,255,255,0.92)', 'stroke-width': '3',
        'stroke-linejoin': 'round', 'paint-order': 'stroke fill',
      }, pLblG);
      continue;
    }

    // ── Polyline — start from first visible dot (midpoint between WC[0] and WC[1]) ──
    let points;
    if (p.pts.length >= 2) {
      const midX = (cx_year(p.pts[0][0]) + cx_year(p.pts[1][0])) / 2;
      const rest  = p.pts.slice(1).map(([yr, g]) => `${f(cx_year(yr))},${f(cy(g))}`).join(' ');
      points = `${f(midX)},${f(cy(p.pts[0][1]))} ${rest}`;
    } else {
      points = p.pts.map(([yr, g]) => `${f(cx_year(yr))},${f(cy(g))}`).join(' ');
    }
    const visibleLine = mk('polyline', {
      points, fill: 'none', stroke: p.color,
      'stroke-width': sw, opacity: op,
      'stroke-linejoin': 'miter', 'stroke-linecap': 'butt',
    }, pLineG);
    mk('polyline', {
      points, fill: 'none', stroke: 'transparent', 'stroke-width': 14,
      style: 'cursor:pointer',
    }, pLineG);

    const hiOn  = () => {
      visibleLine.setAttribute('stroke-width', p.active ? 4 : 2.5);
      dimOthers(code);
    };
    const hiOff = () => {
      visibleLine.setAttribute('stroke-width', sw);
      restoreAll();
    };

    // Attach hover to the hit polyline (last child of pLineG)
    pLineG.lastChild.addEventListener('mouseenter', hiOn);
    pLineG.lastChild.addEventListener('mouseleave', hiOff);

    // ── Dots ──
    for (const dot of p.dots) {
      if (dot.cumGoals === 0 || dot.tourGoals === 0) continue;
      const dxNum = dot.isMid
        ? (cx_year(dot.wx) + cx_year(dot.nextWx)) / 2
        : cx_year(dot.wx);
      const px = f(dxNum), py = f(cy(dot.cumGoals));
      mk('circle', { cx: px, cy: py, r: haloR, fill: '#fff' }, pDotG);
      mk('circle', { cx: px, cy: py, r: dotR,  fill: p.color, opacity: op }, pDotG);
      const hit = mk('circle', { cx: px, cy: py, r: 13, fill: 'transparent', style: 'cursor:pointer' }, pDotG);
      hit.addEventListener('mouseenter', e => { hiOn(); ttShow(e, dot, p.name, p.color); });
      hit.addEventListener('mousemove',  ttMove);
      hit.addEventListener('mouseleave', () => { hiOff(); ttHide(); });
      hit.addEventListener('touchstart', e => { e.preventDefault(); hiOn(); ttShow(e, dot, p.name, p.color); }, { passive: false });
      hit.addEventListener('touchend',   () => { hiOff(); ttHide(); });
    }

    // ── End label: retired multi-WC players ──
    if (!p.active) {
      txt(`${p.flag} ${p.name}  ${p.endY}`, {
        x: f(cx_year(p.endWC)), y: f(cy(p.endY) - 10),
        'text-anchor': 'middle', fill: '#64748b',
        'font-size': '11.5', 'font-weight': '400',
        stroke: 'rgba(255,255,255,0.92)', 'stroke-width': '3',
        'stroke-linejoin': 'round', 'paint-order': 'stroke fill',
      }, pLblG);
    }

    // ── End label: active players (collision-resolved after loop) ──
    if (p.active) {
      endLabels.push({ code, x: cx_year(p.endWC) + 8, y: cy(p.endY) + 4,
                       text: `${p.flag} ${p.name}  ${p.endY}`, color: p.color });
    }
  }

  // Resolve active label collisions: sort top→bottom, push DOWN if < 14px gap
  endLabels.sort((a, b) => a.y - b.y);
  for (let i = 1; i < endLabels.length; i++) {
    if (endLabels[i].y - endLabels[i - 1].y < 16) {
      endLabels[i].y = endLabels[i - 1].y + 16;
    }
  }
  for (const lbl of endLabels) {
    const pg = allGroups.find(g => g.code === lbl.code);
    txt(lbl.text, {
      x: f(lbl.x), y: f(lbl.y),
      'text-anchor': 'start', fill: lbl.color,
      'font-size': '14', 'font-weight': '700',
      stroke: 'rgba(255,255,255,0.92)', 'stroke-width': '4',
      'stroke-linejoin': 'round', 'paint-order': 'stroke fill',
    }, pg.pLblG);
  }
}

// ── Main ──
async function main() {
  let rendered = false;
  try {
    const cached = localStorage.getItem(LS_KEY);
    if (cached) {
      render(mergePlayerData(HISTORICAL_DATA, JSON.parse(cached)));
      rendered = true;
    }
  } catch {}

  try {
    const live2026 = await fetchTopScorers();
    try { localStorage.setItem(LS_KEY, JSON.stringify(live2026)); } catch {}
    render(mergePlayerData(HISTORICAL_DATA, live2026));
    rendered = true;
  } catch (e) {
    if (!rendered) render(HISTORICAL_DATA);
  }

  window.parent.postMessage({ type: 'wc2026-resize', height: document.body.scrollHeight }, '*');
}

main();
</script>
