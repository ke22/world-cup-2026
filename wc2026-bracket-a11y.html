<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous" async></script>
<title>FIFA 世界杯 2026 淘汰賽（無障礙版）</title>
<style>
/* ── A11y Design System — WCAG 2.1 AA / 長輩優化 ── */
:root {
  --bg:         #ffffff;
  --surface:    #f5f5f5;
  --surface-2:  #ebebeb;
  --fg:         #1a1a1a;
  --muted:      #595959;
  --accent:     #0056b3;
  --accent-2:   #003d82;
  --accent-soft:#e8f0fb;
  --border:     #767676;
  --shadow:     rgba(0,0,0,0.12);
  --live:       #c0392b;
  --header-bg:  #003d82;
  --focus:      #0056b3;
  --gold:       #856404;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 18px; min-height: -webkit-fill-available; }
body {
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC",
    "Microsoft JhengHei", Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
  font-size: 1rem;
  line-height: 1.6;
  min-height: -webkit-fill-available;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
  border-radius: 4px;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--accent);
  color: #fff;
  padding: 10px 20px;
  font-size: 1rem;
  font-weight: 700;
  z-index: 10000;
  border-radius: 0 0 8px 0;
  text-decoration: none;
}
.skip-link:focus { left: 0; outline: 3px solid #fff; outline-offset: -3px; }

.cna-logo { height: 28px; width: auto; filter: brightness(0) invert(1); opacity: 0.95; flex-shrink: 0; }
.ver-tag { font-size: 0.7rem; font-weight: 600; color: rgba(255,255,255,0.75); flex-shrink: 0; }

/* ── Page ── */
.page {
  max-width: 1000px;
  margin: 0 auto;
  padding: 14px 14px 0;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
}

.page-header {
  background: var(--header-bg);
  border-radius: 16px 16px 0 0;
  padding: 18px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.page-header-title {
  font-size: 1.2rem; font-weight: 700; color: #fff;
  flex: 1; min-width: 0;
}

/* ── Content area ── */
.bracket-content {
  background: var(--bg);
  border: 2px solid var(--border);
  border-top: none;
  border-radius: 0 0 16px 16px;
  box-shadow: 0 10px 30px var(--shadow);
  padding: 20px;
  flex: 1;
  overflow-y: auto;
}

/* ── Round section ── */
.round-section {
  margin-bottom: 32px;
}
.round-section:last-child { margin-bottom: 8px; }

.round-heading {
  font-size: 1.2rem; font-weight: 800; color: var(--accent-2);
  padding: 10px 0 14px;
  border-bottom: 2px solid var(--border);
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px;
}
.round-heading .round-icon { font-size: 1.4rem; }

/* ── Match cards ── */
.match-card {
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 12px;
  background: var(--bg);
  box-shadow: 0 2px 8px var(--shadow);
}
.match-card.live {
  background: #fff5f4;
  border-color: var(--live);
}
.match-card.final {
  border-color: var(--gold);
  background: #fffef0;
}

.card-teams {
  display: flex; align-items: center; justify-content: space-between;
}
.team {
  display: flex; flex-direction: column; align-items: center;
  gap: 6px; min-width: 80px; max-width: 110px;
}
.team-flag { font-size: 2rem; line-height: 1; }
.team-name {
  font-size: 0.9rem; font-weight: 700; color: var(--fg);
  text-align: center; line-height: 1.3;
}
.team-name.tbd { color: var(--muted); font-weight: 400; font-style: italic; }

.card-center {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px; flex: 1; padding: 0 8px;
}
.score-finished { font-size: 2rem; font-weight: 800; color: var(--fg); letter-spacing: 4px; }
.score-live     { font-size: 1.8rem; font-weight: 800; color: var(--live); letter-spacing: 4px; }
.kickoff-time   { font-size: 1.6rem; font-weight: 400; color: var(--accent); display: flex; flex-direction: column; align-items: center; gap: 1px; }
.kt-ampm        { font-size: 0.6em; font-weight: 500; }
.tz-note        { font-size: 0.58rem; font-weight: 400; color: var(--muted); letter-spacing: 0.3px; }
.live-badge {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.78rem; font-weight: 800; color: var(--live);
  border: 2px solid var(--live); border-radius: 6px; padding: 2px 8px;
}
.live-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--live);
  animation: blink 1s ease-in-out infinite;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.15; } }

.card-info {
  margin-top: 12px; text-align: center;
  font-size: 0.83rem; color: var(--muted); line-height: 1.6;
  border-top: 1px solid var(--border); padding-top: 10px;
}

/* ── States ── */
.state-msg {
  text-align: center; padding: 48px 24px;
  font-size: 1rem; color: var(--muted);
}
.state-error { color: #721c24; font-weight: 600; }

img.emoji { height: 1.2em; width: 1.2em; vertical-align: -0.2em; display: inline-block; }

@media (prefers-contrast: more) {
  :root { --border: #000000; --muted: #000000; }
  .match-card { border-color: #000; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<a href="#main-content" class="skip-link">跳至主要內容</a>

<div class="page">
  <header class="page-header">
    <h1 class="page-header-title">🏆 FIFA 世界杯 2026 淘汰賽</h1>
    <span class="ver-tag">v1.1-a11y</span>
    <img src="cna_logo.svg" class="cna-logo" alt="CNA 中央通訊社">
  </header>

  <main id="main-content">
    <div class="bracket-content" id="bracket-content">
      <div role="status" class="state-msg">載入賽程資料中⋯</div>
    </div>
  </main>
</div>

<script>
const GAS_URL   = 'https://script.google.com/macros/s/AKfycbw6CYUYELg_1hfnuozFtiq2HkyvHzz-O2KPUTkRQ7NOrJqW64tXlWgrM4JiRDR8ZRQDiA/exec';
const CACHE_TTL = 300;

function fmtTime(hhmm) {
  if (!hhmm) return hhmm;
  const [hStr, mStr] = hhmm.split(':');
  const h = parseInt(hStr, 10);
  const period = h < 12 ? 'AM' : 'PM';
  const hour12 = h % 12 || 12;
  return `${hour12}:${mStr}<span class="kt-ampm"> ${period}</span>`;
}

const ROUND_ORDER = ['32強','16強','8強','4強','季軍賽','決賽'];
const ROUND_ICONS = {
  '32強':'⚔️', '16強':'🎯', '8強':'💥', '4強':'🌟', '季軍賽':'🥉', '決賽':'🏆'
};
const KO_PHASES = new Set(['32強','16強','8強','4強','季軍賽','決賽']);

function parseTwemoji(el) {
  if (typeof twemoji !== 'undefined') twemoji.parse(el, { base: 'emoji/', folder: 'svg', ext: '.svg' });
}

function cacheGet(key) {
  try {
    const raw = sessionStorage.getItem(key);
    if (!raw) return null;
    const { ts, data } = JSON.parse(raw);
    if (Date.now() - ts < CACHE_TTL * 1000) return data;
    sessionStorage.removeItem(key);
    return null;
  } catch { return null; }
}

function cacheSet(key, data) {
  try {
    sessionStorage.setItem(key, JSON.stringify({ ts: Date.now(), data }));
  } catch {}
}

async function fetchAllMatches() {
  const key = 'wc26_all_bracket_a11y';
  const hit = cacheGet(key);
  if (hit) return hit;
  const url = `${GAS_URL}?action=getMatches`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (json.status === 'error') throw new Error(json.message);
  cacheSet(key, json.data);
  return json.data;
}

function renderMatchCard(m, isFinal) {
  const t1name = (m.team1 && (m.team1.name || m.team1.code)) || '待定';
  const t2name = (m.team2 && (m.team2.name || m.team2.code)) || '待定';
  const t1flag = (m.team1 && m.team1.flag) || '🏳️';
  const t2flag = (m.team2 && m.team2.flag) || '🏳️';
  const t1tbd  = !m.team1 || (!m.team1.name && !m.team1.code);
  const t2tbd  = !m.team2 || (!m.team2.name && !m.team2.code);

  let centerHtml = '';
  let cardClass  = 'match-card' + (isFinal ? ' final' : '');
  let scoreAria  = '';

  if (m.status === 'finished') {
    centerHtml = `<div class="score-finished" aria-label="比分 ${m.score1} 比 ${m.score2}">${m.score1}&thinsp;:&thinsp;${m.score2}</div>`;
    scoreAria  = `${t1name} ${m.score1} 比 ${m.score2} ${t2name}，已結束`;
  } else if (m.status === 'live') {
    cardClass += ' live';
    centerHtml = `
      <div class="live-badge"><span class="live-dot" aria-hidden="true"></span>直播中</div>
      <div class="score-live" aria-label="目前比分 ${m.score1} 比 ${m.score2}">${m.score1}&thinsp;:&thinsp;${m.score2}</div>
    `;
    scoreAria = `直播中：${t1name} ${m.score1} 比 ${m.score2} ${t2name}`;
  } else {
    const time = m.time_utc8 || '時間待定';
    const date = m.date || '';
    centerHtml = `<div class="kickoff-time" aria-label="開賽時間 ${date} ${time} 台灣時間"><span>${date ? date.slice(5) + ' ' : ''}${fmtTime(time)}</span><span class="tz-note" aria-hidden="true">台灣時間</span></div>`;
    scoreAria  = `${t1name} 對 ${t2name}，${date} ${time} 台灣時間`;
  }

  const parts = [];
  if (m.venue) parts.push(m.venue);
  if (m.city)  parts.push(m.city);
  const infoLine = parts.join(' · ');

  return `
    <article class="${cardClass}" aria-label="${scoreAria}">
      <div class="card-teams" aria-hidden="true">
        <div class="team">
          <span class="team-flag">${t1flag}</span>
          <span class="team-name${t1tbd ? ' tbd' : ''}">${t1name}</span>
        </div>
        <div class="card-center">${centerHtml}</div>
        <div class="team">
          <span class="team-flag">${t2flag}</span>
          <span class="team-name${t2tbd ? ' tbd' : ''}">${t2name}</span>
        </div>
      </div>
      ${infoLine ? `<p class="card-info">${infoLine}</p>` : ''}
    </article>
  `;
}

function renderBracket(matches) {
  const byRound = {};
  matches
    .filter(m => KO_PHASES.has(m.phase))
    .forEach(m => {
      if (!byRound[m.phase]) byRound[m.phase] = [];
      byRound[m.phase].push(m);
    });

  const content = document.getElementById('bracket-content');

  if (!Object.keys(byRound).length) {
    content.innerHTML = '<p class="state-msg">淘汰賽資料尚未公布</p>';
    notifyHeight();
    return;
  }

  content.innerHTML = ROUND_ORDER
    .filter(r => byRound[r] && byRound[r].length)
    .map(round => {
      const icon = ROUND_ICONS[round] || '⚽';
      const isFinal = round === '決賽';
      const cards = byRound[round].map(m => renderMatchCard(m, isFinal)).join('');
      return `
        <section class="round-section" aria-label="${round}">
          <h2 class="round-heading">
            <span class="round-icon" aria-hidden="true">${icon}</span>
            ${round}
          </h2>
          ${cards}
        </section>
      `;
    }).join('');

  parseTwemoji(content);
  notifyHeight();
}

function notifyHeight() {
  try {
    window.parent.postMessage(
      { type: 'wc2026-resize', height: document.documentElement.scrollHeight },
      '*'
    );
  } catch {}
}

async function init() {
  const content = document.getElementById('bracket-content');

  if (!GAS_URL) {
    content.innerHTML = '<div role="status" class="state-msg state-error">資料來源未設定</div>';
    notifyHeight();
    return;
  }

  try {
    const matches = await fetchAllMatches();
    renderBracket(matches);
  } catch {
    content.innerHTML = '<div role="status" class="state-msg state-error">資料載入失敗，請稍後重試</div>';
    notifyHeight();
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
