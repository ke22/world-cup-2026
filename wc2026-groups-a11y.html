<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous" async></script>
<title>FIFA 世界杯 2026 分組積分榜（無障礙版）</title>
<style>
/* ── A11y Design System — WCAG 2.1 AA / 長輩優化 ── */
:root {
  --bg:         #ffffff;
  --surface:    #f5f5f5;
  --surface-2:  #ebebeb;
  --fg:         #1a1a1a;
  --muted:      #595959;
  --accent:     #0056b3;
  --accent-2:   #003d82;
  --accent-soft:#e8f0fb;
  --border:     #767676;
  --shadow:     rgba(0,0,0,0.12);
  --header-bg:  #003d82;
  --focus:      #0056b3;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 18px; min-height: -webkit-fill-available; }
body {
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC",
    "Microsoft JhengHei", Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
  font-size: 1rem;
  line-height: 1.6;
  min-height: -webkit-fill-available;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
  border-radius: 4px;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--accent);
  color: #fff;
  padding: 10px 20px;
  font-size: 1rem;
  font-weight: 700;
  z-index: 10000;
  border-radius: 0 0 8px 0;
  text-decoration: none;
}
.skip-link:focus { left: 0; outline: 3px solid #fff; outline-offset: -3px; }

.cna-logo { height: 28px; width: auto; filter: brightness(0) invert(1); opacity: 0.95; flex-shrink: 0; }
.ver-tag { font-size: 0.7rem; font-weight: 600; color: rgba(255,255,255,0.75); letter-spacing: 0.3px; flex-shrink: 0; }

.page {
  max-width: 1200px;
  margin: 0 auto;
  padding: 14px 14px 0;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
}

.page-header {
  background: var(--header-bg);
  border-radius: 16px 16px 0 0;
  padding: 18px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.page-header-title {
  font-size: 1.2rem; font-weight: 700; color: #fff;
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ── Anchor nav (sticky) ── */
.anchor-nav {
  background: var(--surface-2);
  border: 2px solid var(--border);
  border-top: none;
  padding: 8px 12px;
  display: flex;
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
  gap: 6px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px var(--shadow);
}
.anchor-nav::-webkit-scrollbar { display: none; }
.anchor-btn {
  height: 48px; padding: 0 16px;
  border-radius: 8px;
  border: 2px solid var(--border);
  background: var(--bg);
  color: var(--accent);
  font-size: 1rem; font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  flex-shrink: 0;
  min-width: 48px;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.anchor-btn:hover {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* ── Groups container ── */
.groups-container {
  background: var(--bg);
  border: 2px solid var(--border);
  border-top: none;
  border-radius: 0 0 16px 16px;
  box-shadow: 0 10px 30px var(--shadow);
  padding: 18px;
  flex: 1;
  overflow-y: auto;
}

@media (max-width: 767px) {
  .page { min-height: 360px; height: 100svh; }
  .groups-container { min-height: 0; }
}

.group-section { margin-bottom: 28px; scroll-margin-top: 68px; }
.group-section:last-child { margin-bottom: 0; }

.group-card {
  border: 2px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 2px 8px var(--shadow);
}
.group-card-title {
  background: var(--surface-2);
  padding: 12px 16px;
  font-size: 1.2rem; font-weight: 800; color: var(--accent);
  border-bottom: 2px solid var(--border);
}

.group-table { width: 100%; border-collapse: collapse; }
.group-table th {
  font-size: 0.83rem; font-weight: 700; color: var(--muted);
  text-align: center; padding: 10px 6px;
  background: var(--surface-2);
  border-bottom: 2px solid var(--border);
}
.group-table th.th-team { text-align: left; padding-left: 14px; }
.group-table td {
  font-size: 1rem; text-align: center; padding: 12px 6px;
  border-top: 1px solid var(--border);
}
.group-table td.td-team { text-align: left; padding-left: 14px; }
.group-table tbody tr:hover td { background: var(--accent-soft); }

.team-cell { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.t-flag { font-size: 1.4rem; line-height: 1; flex-shrink: 0; }
.t-name { font-size: 1rem; font-weight: 700; color: var(--fg); }

.rank-cell { color: var(--muted); font-size: 0.9rem; font-weight: 700; }
.pts-cell  { font-size: 1rem; font-weight: 800; color: var(--accent); }
.gd-cell   { font-size: 1rem; font-weight: 600; }
.gd-cell.positive { color: #155724; }
.gd-cell.negative { color: #721c24; }

.state-msg {
  text-align: center; padding: 48px 24px;
  font-size: 1rem; color: var(--muted);
}
.state-error { color: #721c24; font-weight: 600; }

img.emoji { height: 1.2em; width: 1.2em; vertical-align: -0.2em; display: inline-block; }

@media (prefers-contrast: more) {
  :root { --border: #000000; --muted: #000000; }
  .group-card, .page { border-color: #000; }
  .group-table th, .group-table td { border-color: #000; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>
<body>

<a href="#main-content" class="skip-link">跳至主要內容</a>

<div class="page">
  <header class="page-header">
    <h1 class="page-header-title">⚽ FIFA 世界杯 2026 分組積分榜</h1>
    <span class="ver-tag">v1.1-a11y</span>
    <img src="cna_logo.svg" class="cna-logo" alt="CNA 中央通訊社">
  </header>

  <nav class="anchor-nav" id="anchor-nav" aria-label="跳至組別">
    <!-- Rendered by JS -->
  </nav>

  <main id="main-content">
    <div class="groups-container" id="groups-container" aria-live="polite" aria-atomic="false">
      <div role="status" class="state-msg">載入積分資料中⋯</div>
    </div>
  </main>
</div>

<script>
const GAS_URL   = 'https://script.google.com/macros/s/AKfycbw6CYUYELg_1hfnuozFtiq2HkyvHzz-O2KPUTkRQ7NOrJqW64tXlWgrM4JiRDR8ZRQDiA/exec';
const CACHE_TTL = 300;

function parseTwemoji(el) {
  if (typeof twemoji !== 'undefined') twemoji.parse(el, { base: 'emoji/', folder: 'svg', ext: '.svg' });
}

function cacheGet(key) {
  try {
    const raw = sessionStorage.getItem(key);
    if (!raw) return null;
    const { ts, data } = JSON.parse(raw);
    if (Date.now() - ts < CACHE_TTL * 1000) return data;
    sessionStorage.removeItem(key);
    return null;
  } catch { return null; }
}

function cacheSet(key, data) {
  try {
    sessionStorage.setItem(key, JSON.stringify({ ts: Date.now(), data }));
  } catch {}
}

async function fetchGroups() {
  const key = 'wc26_groups_a11y';
  const hit = cacheGet(key);
  if (hit) return hit;
  const url = `${GAS_URL}?action=getGroups`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (json.status === 'error') throw new Error(json.message || 'API error');
  cacheSet(key, json.data);
  return json.data;
}

function renderAnchorNav(groupKeys) {
  const nav = document.getElementById('anchor-nav');
  nav.innerHTML = groupKeys.map(g =>
    `<button class="anchor-btn" onclick="scrollToGroup('${g}')" aria-label="跳至 ${g} 組">${g} 組</button>`
  ).join('');
}

function scrollToGroup(letter) {
  const el = document.getElementById(`group-${letter}`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function gdDisplay(gd) {
  if (gd > 0) return { text: `+${gd}`, cls: 'gd-cell positive' };
  if (gd < 0) return { text: `${gd}`, cls: 'gd-cell negative' };
  return { text: '0', cls: 'gd-cell' };
}

function renderGroups(groups) {
  const byGroup = {};
  groups.forEach(entry => {
    const g = entry.group;
    if (!byGroup[g]) byGroup[g] = [];
    byGroup[g].push(entry);
  });

  Object.values(byGroup).forEach(arr =>
    arr.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf)
  );

  const groupKeys = Object.keys(byGroup).sort();
  renderAnchorNav(groupKeys);

  document.getElementById('groups-container').innerHTML = groupKeys.map(g => {
    const teams = byGroup[g];
    const rows = teams.map((t, i) => {
      const { text: gdText, cls: gdCls } = gdDisplay(t.gd);
      const tname = t.team.name || t.team.code;
      return `
        <tr>
          <td class="rank-cell" aria-label="第 ${i+1} 名">${i + 1}</td>
          <td class="td-team">
            <div class="team-cell">
              <span class="t-flag" aria-hidden="true">${t.team.flag}</span>
              <span class="t-name">${tname}</span>
            </div>
          </td>
          <td aria-label="${tname} 出賽 ${t.played} 場">${t.played}</td>
          <td aria-label="勝 ${t.win}">${t.win}</td>
          <td aria-label="平 ${t.draw}">${t.draw}</td>
          <td aria-label="負 ${t.loss}">${t.loss}</td>
          <td class="${gdCls}" aria-label="球差 ${gdText}">${gdText}</td>
          <td class="pts-cell" aria-label="積分 ${t.pts}">${t.pts}</td>
        </tr>
      `;
    }).join('');

    return `
      <section class="group-section" id="group-${g}" aria-label="${g} 組積分">
        <div class="group-card">
          <h2 class="group-card-title">${g} 組</h2>
          <table class="group-table" aria-label="${g} 組積分表">
            <thead>
              <tr>
                <th scope="col">名次</th>
                <th scope="col" class="th-team">隊伍</th>
                <th scope="col">出賽</th>
                <th scope="col">勝</th>
                <th scope="col">平</th>
                <th scope="col">負</th>
                <th scope="col">球差</th>
                <th scope="col">積分</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </section>
    `;
  }).join('');
}

function notifyHeight() {
  try {
    window.parent.postMessage(
      { type: 'wc2026-resize', height: document.documentElement.scrollHeight },
      '*'
    );
  } catch {}
}

async function init() {
  if (!GAS_URL) {
    document.getElementById('groups-container').innerHTML =
      '<div role="status" class="state-msg state-error">資料來源未設定</div>';
    notifyHeight();
    return;
  }
  try {
    const groups = await fetchGroups();
    renderGroups(groups);
    parseTwemoji(document.getElementById('groups-container'));
    notifyHeight();
  } catch (err) {
    document.getElementById('groups-container').innerHTML =
      '<div role="status" class="state-msg state-error">積分榜載入失敗，請稍後重試</div>';
    notifyHeight();
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
