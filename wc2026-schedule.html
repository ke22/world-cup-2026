<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
<title>FIFA 世界杯 2026 賽程</title>
<style>
/* ── CNA Design System Variables ── */
:root {
  color-scheme: light;
  --bg: #eef2f6;
  --surface: #ffffff;
  --surface-2: #f5f8fc;
  --fg: #1f2937;
  --muted: #66758a;
  --border: rgba(15, 50, 96, 0.12);
  --shadow: rgba(15, 75, 143, 0.08);
  --accent: #0f4b8f;
  --accent-2: #2c73c9;
  --accent-soft: rgba(15, 75, 143, 0.08);
  --header-from: #13579f;
  --header-to: #0f4b8f;
  --live-color: #d63200;
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { min-height: -webkit-fill-available; }
body {
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC",
    "Microsoft JhengHei", Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
  font-size: 14px;
  line-height: 1.5;
  min-height: -webkit-fill-available;
}
button { font-family: inherit; cursor: pointer; border: none; }

/* ── CNA Logo ── */
.cna-logo { height: 24px; width: auto; filter: brightness(0) invert(1); opacity: 0.9; flex-shrink: 0; }
.ver-tag { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.5); letter-spacing: 0.3px; flex-shrink: 0; }

/* ── Wrapper ── */
.wrapper {
  max-width: 900px;
  margin: 0 auto;
  padding: 14px 14px 0;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
}

/* ── Main panel ── */
.panel {
  background: var(--surface);
  border-radius: 16px;
  border: 1px solid var(--border);
  box-shadow: 0 10px 30px var(--shadow);
  overflow: hidden;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

/* ── App container ── */
#app { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }

/* ── Header ── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px;
  background: linear-gradient(180deg, var(--header-from) 0%, var(--header-to) 100%);
  gap: 10px;
}
.header-title {
  font-size: 17px; font-weight: 700; color: #fff;
  letter-spacing: 0.2px; line-height: 1.3;
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.header-actions { display: flex; gap: 8px; flex-shrink: 0; }
.btn-action {
  height: 34px; padding: 0 14px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.35);
  background: rgba(255,255,255,0.12);
  color: #fff;
  font-size: 13px; font-weight: 500;
  transition: background 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.btn-action:hover { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.55); }
.btn-action.test { border-color: rgba(255,180,120,0.5); color: #ffd4a8; }
.btn-action.test:hover { background: rgba(255,140,60,0.18); }

/* ── Date nav ── */
.date-nav {
  display: flex; align-items: center;
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
  gap: 0;
  overflow: hidden; /* ensure no overflow */
}
.nav-arrow {
  background: none; border: none;
  font-size: 20px; color: var(--accent); padding: 4px 4px;
  flex-shrink: 0; line-height: 1; border-radius: 8px;
  transition: background 0.12s;
}
.nav-arrow:hover { background: var(--accent-soft); }
.date-tabs { display: flex; flex: 1; justify-content: space-around; overflow: hidden; }
.date-tab {
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 4px; border-radius: 10px; border: none; background: none;
  flex: 1; min-width: 0; color: var(--muted);
  transition: background 0.12s, color 0.12s;
}
.date-tab:hover { background: var(--accent-soft); color: var(--fg); }
.date-tab.active {
  background: rgba(15, 75, 143, 0.10);
  color: var(--accent);
}
.date-tab .wd { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
.date-tab .dy { font-size: 16px; font-weight: 400; }
.date-tab.active .dy { font-weight: 700; }
.date-tab .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-2); margin-top: 4px; }
.date-tab .dot-placeholder { width: 5px; height: 5px; margin-top: 4px; }
.date-tab .month-label { font-size: 9px; font-weight: 700; color: var(--accent-2); letter-spacing: 0.2px; min-height: 12px; line-height: 12px; }
.date-nav-month { font-size: 11px; font-weight: 700; color: var(--accent); flex-shrink: 0; padding: 0 4px; }

/* ── Match list ── */
.match-list {
  padding: 12px 14px 14px;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.day-header { padding: 4px 0 10px; }
.day-header-title { font-size: 13px; font-weight: 600; color: var(--muted); }

/* ── Match card ── */
.match-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 8px;
  background: var(--surface);
  box-shadow: 0 2px 8px rgba(15, 75, 143, 0.04);
  transition: box-shadow 0.15s;
}
.match-card:hover { box-shadow: 0 4px 16px rgba(15, 75, 143, 0.10); }
.match-card.live {
  background: #fff8f5;
  border-color: rgba(214, 50, 0, 0.3);
  box-shadow: 0 2px 12px rgba(214, 50, 0, 0.08);
}

.card-teams {
  display: flex; align-items: center; justify-content: space-between;
}
.team {
  display: flex; flex-direction: column; align-items: center;
  gap: 5px; min-width: 72px; max-width: 90px;
}
.team-flag { font-size: 28px; line-height: 1; }
.team-name {
  font-size: 12px; font-weight: 700; color: var(--fg);
  text-align: center; line-height: 1.3;
}

.card-center {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px; flex: 1; padding: 0 8px;
}
.score-finished { font-size: 30px; font-weight: 800; color: var(--fg); letter-spacing: 4px; }
.score-live     { font-size: 28px; font-weight: 800; color: var(--live-color); letter-spacing: 4px; }
.kickoff-time   { font-size: 26px; font-weight: 300; color: var(--accent); }
.live-badge {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 700; color: var(--live-color); letter-spacing: 0.8px;
}
.live-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--live-color);
  animation: blink 1s ease-in-out infinite;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.15; } }

.card-info {
  margin-top: 10px; text-align: center;
  font-size: 11px; color: var(--muted); line-height: 1.6;
  border-top: 1px solid var(--border); padding-top: 8px;
}

/* ── States ── */
.state-msg {
  text-align: center; padding: 40px 20px;
  font-size: 15px; color: var(--muted);
}
.state-error { color: #c0392b; }
.state-error small { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }

/* ── Overlay ── */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(15, 23, 42, 0.55); z-index: 9999;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.overlay.open { display: flex; align-items: flex-start; justify-content: center; padding: 20px; }
.overlay-panel {
  background: var(--surface);
  border-radius: 16px;
  border: 1px solid var(--border);
  box-shadow: 0 20px 50px rgba(15, 50, 96, 0.18);
  width: 100%; max-width: 720px;
  overflow: hidden; margin: auto;
}
.overlay-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px;
  background: linear-gradient(180deg, var(--header-from) 0%, var(--header-to) 100%);
}
.overlay-title { font-size: 17px; font-weight: 700; color: #fff; letter-spacing: 0.2px; }
.btn-close {
  background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
  border-radius: 8px; width: 32px; height: 32px;
  font-size: 18px; color: #fff; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.btn-close:hover { background: rgba(255,255,255,0.28); }

/* ── Groups grid ── */
.groups-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 14px;
}
@media (max-width: 500px) { .groups-grid { grid-template-columns: 1fr; } }

.group-card {
  border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden;
  box-shadow: 0 2px 8px rgba(15, 75, 143, 0.04);
}
.group-card-title {
  background: var(--surface-2);
  padding: 7px 10px;
  font-size: 11px; font-weight: 700; color: var(--accent);
  letter-spacing: 0.5px; text-transform: uppercase;
  border-bottom: 1px solid var(--border);
}
.group-table { width: 100%; border-collapse: collapse; }
.group-table th {
  font-size: 10px; font-weight: 600; color: var(--muted);
  text-align: center; padding: 5px 3px;
}
.group-table th:nth-child(2) { text-align: left; padding-left: 6px; }
.group-table td {
  font-size: 12px; text-align: center; padding: 6px 3px;
  border-top: 1px solid rgba(15, 50, 96, 0.06);
}
.group-table td:nth-child(2) { text-align: left; padding-left: 6px; }
.group-table .rank { color: var(--muted); font-size: 11px; }
.group-table .team-cell { display: flex; align-items: center; gap: 5px; }
.group-table .t-flag { font-size: 14px; }
.group-table .t-name { font-size: 11px; font-weight: 600; color: var(--fg); }
.group-table .pts-cell { font-weight: 800; color: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>
<body>

<div class="wrapper">
  <div class="panel" id="app"></div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="分組積分榜">
  <div class="overlay-panel" id="overlay-panel">
    <div class="overlay-header">
      <span class="overlay-title">分組積分榜</span>
      <button class="btn-close" id="btn-close" aria-label="關閉">&#215;</button>
    </div>
    <div class="groups-grid" id="groups-grid">
      <div class="state-msg">載入中…</div>
    </div>
  </div>
</div>

<script>
// ── 部署時修改這裡 ───────────────────────────
const GAS_URL      = 'https://script.google.com/macros/s/AKfycbw6CYUYELg_1hfnuozFtiq2HkyvHzz-O2KPUTkRQ7NOrJqW64tXlWgrM4JiRDR8ZRQDiA/exec';   // GAS Web App 部署 URL
const CACHE_TTL    = 300;  // 快取秒數
const LIVE_REFRESH = 60;   // live 場次自動刷新秒數
// ────────────────────────────────────────────

const WEEKDAYS = ['日','一','二','三','四','五','六'];

// ─── State ───────────────────────────────────

let allMatches       = [];
let windowStart      = null;   // Date — first day of 7-day nav window
let activeDate       = '';     // YYYY-MM-DD
let liveTimer        = null;

// ─── Date utilities ───────────────────────────

function toYMD(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

// Parse YYYY-MM-DD as a local date (avoids UTC-offset day shift)
function parseYMD(str) {
  const [y, mo, d] = str.split('-').map(Number);
  return new Date(y, mo - 1, d);
}

function formatDateLabel(ymd) {
  const d   = parseYMD(ymd);
  const m   = d.getMonth() + 1;
  const day = d.getDate();
  const wd  = WEEKDAYS[d.getDay()];
  return `${m}月${day}日（${wd}）`;
}

// ─── sessionStorage cache ─────────────────────

function cacheGet(key) {
  try {
    const raw = sessionStorage.getItem(key);
    if (!raw) return null;
    const { ts, data } = JSON.parse(raw);
    if (Date.now() - ts < CACHE_TTL * 1000) return data;
    sessionStorage.removeItem(key);
    return null;
  } catch { return null; }
}

function cacheSet(key, data) {
  try {
    sessionStorage.setItem(key, JSON.stringify({ ts: Date.now(), data }));
  } catch {}
}

// ─── API fetch ────────────────────────────────

async function apiFetch(params) {
  const url = GAS_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (json.status === 'error') throw new Error(json.message || 'API error');
  return json.data;
}

async function fetchAllMatches(bypassCache) {
  const key = 'wc26_all';
  if (!bypassCache) {
    const hit = cacheGet(key);
    if (hit) return hit;
  }
  const data = await apiFetch({ action: 'getMatches' });
  cacheSet(key, data);
  return data;
}

async function fetchGroups() {
  const key = 'wc26_groups';
  const hit = cacheGet(key);
  if (hit) return hit;
  const data = await apiFetch({ action: 'getGroups' });
  cacheSet(key, data);
  return data;
}

// ─── Match date helpers ───────────────────────

function getMatchDateSet() {
  return new Set(allMatches.map(m => m.date));
}

function findInitialDate() {
  const today  = toYMD(new Date());
  const dates  = [...getMatchDateSet()].sort();
  if (!dates.length) return today;
  if (dates.includes(today)) return today;
  const future = dates.find(d => d >= today);
  return future || dates[0];
}

function setWindowForDate(ymd) {
  const d   = parseYMD(ymd);
  const dow = d.getDay();                       // 0 = Sun
  const toMon = dow === 0 ? -6 : 1 - dow;      // offset to Monday
  windowStart = addDays(d, toMon);
}

// ─── Live refresh ─────────────────────────────

function hasLiveOnActiveDate() {
  return allMatches.some(m => m.date === activeDate && m.status === 'live');
}

function startLiveRefresh() {
  stopLiveRefresh();
  if (!hasLiveOnActiveDate()) return;
  liveTimer = setInterval(async () => {
    try {
      allMatches = await fetchAllMatches(true);
      renderMatches();
      notifyHeight();
      if (!hasLiveOnActiveDate()) stopLiveRefresh();
    } catch { /* network hiccup — keep timer */ }
  }, LIVE_REFRESH * 1000);
}

function stopLiveRefresh() {
  if (liveTimer !== null) { clearInterval(liveTimer); liveTimer = null; }
}

// ─── Render: shell ────────────────────────────

function renderShell() {
  document.getElementById('app').innerHTML = `
    <div class="header">
      <span class="header-title">⚽ FIFA 世界杯 2026 賽程</span>
      <div class="header-actions">
        <button class="btn-action test" id="btn-test">測試比分</button>
        <span class="ver-tag">v1.0</span>
        <img src="cna_logo.svg" class="cna-logo" alt="CNA">
      </div>
    </div>
    <div class="date-nav" id="date-nav"></div>
    <div class="match-list" id="match-list"></div>
  `;
  document.getElementById('btn-test').addEventListener('click', () => {
    if (!allMatches.length) return;
    const m = allMatches[0];
    const wasFinished = m.status === 'finished';
    m.status = wasFinished ? 'upcoming' : 'finished';
    m.score1 = wasFinished ? null : 2;
    m.score2 = wasFinished ? null : 1;
    activeDate = m.date;
    setWindowForDate(activeDate);
    renderDateNav();
    renderMatches();
    notifyHeight();
  });
}

// ─── Render: date nav ─────────────────────────

function renderDateNav() {
  const nav        = document.getElementById('date-nav');
  if (!nav) return;
  const matchDates = getMatchDateSet();

  const tabs = Array.from({ length: 7 }, (_, i) => {
    const d        = addDays(windowStart, i);
    const ymd      = toYMD(d);
    const wd       = WEEKDAYS[d.getDay()];
    const dayNum   = d.getDate();
    const month    = d.getMonth() + 1;
    const hasMatch = matchDates.has(ymd);
    const isActive = ymd === activeDate;
    return { ymd, wd, dayNum, month, hasMatch, isActive };
  });

  // Determine month display strategy
  const uniqueMonths = [...new Set(tabs.map(t => t.month))];
  const isCrossMonth = uniqueMonths.length > 1;

  // When cross-month: mark tabs that start a new month (i > 0)
  const showMonthAt = new Set();
  if (isCrossMonth) {
    let prev = tabs[0].month;
    for (let i = 1; i < tabs.length; i++) {
      if (tabs[i].month !== prev) { showMonthAt.add(i); prev = tabs[i].month; }
    }
  }

  // Single-month: show month name beside left arrow
  const singleMonthHtml = !isCrossMonth
    ? `<span class="date-nav-month">${tabs[0].month}月</span>`
    : '';

  nav.innerHTML = `
    <button class="nav-arrow" id="nav-prev" aria-label="前一週">&#8249;</button>
    ${singleMonthHtml}
    <div class="date-tabs" role="tablist">
      ${tabs.map(({ ymd, wd, dayNum, month, hasMatch, isActive }, i) => `
        <button class="date-tab${isActive ? ' active' : ''}"
                data-date="${ymd}"
                role="tab"
                aria-selected="${isActive}"
                aria-label="${ymd}">
          <span class="month-label">${showMonthAt.has(i) ? `${month}月` : ''}</span>
          <span class="wd">${wd}</span>
          <span class="dy">${dayNum}</span>
          ${hasMatch ? '<span class="dot"></span>' : '<span class="dot-placeholder"></span>'}
        </button>
      `).join('')}
    </div>
    <button class="nav-arrow" id="nav-next" aria-label="後一週">&#8250;</button>
  `;

  nav.querySelectorAll('.date-tab').forEach(btn =>
    btn.addEventListener('click', () => selectDate(btn.dataset.date))
  );
  document.getElementById('nav-prev').addEventListener('click', () => shiftWindow(-7));
  document.getElementById('nav-next').addEventListener('click', () => shiftWindow(7));

  scrollToActiveTab();
}

function scrollToActiveTab() {
  const activeTab = document.querySelector('.date-tab.active');
  if (activeTab) {
    activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }
}

// ─── Render: match list ───────────────────────

function renderMatches() {
  const list    = document.getElementById('match-list');
  if (!list) return;
  const matches = allMatches.filter(m => m.date === activeDate);

  if (!matches.length) {
    list.innerHTML = '<div class="state-msg">本日無賽事</div>';
    notifyHeight();
    return;
  }

  const d = parseYMD(activeDate);
  list.innerHTML = `
    <div class="day-header">
      <span class="day-header-title">${formatDateLabel(activeDate)} ${d.getFullYear()}</span>
    </div>
    ${matches.map(renderMatchCard).join('')}
  `;
  if (typeof twemoji !== 'undefined') twemoji.parse(list, { folder: 'svg', ext: '.svg' });
  notifyHeight();
}

function renderMatchCard(m) {
  let centerHtml = '';
  let cardClass  = 'match-card';

  if (m.status === 'finished') {
    centerHtml = `<div class="score-finished">${m.score1}&thinsp;:&thinsp;${m.score2}</div>`;
  } else if (m.status === 'live') {
    cardClass += ' live';
    centerHtml = `
      <div class="live-badge"><span class="live-dot"></span>LIVE</div>
      <div class="score-live">${m.score1}&thinsp;:&thinsp;${m.score2}</div>
    `;
  } else {
    centerHtml = `<div class="kickoff-time">${m.time_utc8}</div>`;
  }

  // Info line: "第1輪 · A組 · Estadio Azteca · 墨西哥城" or "8強 · venue · city"
  const parts = [];
  if (m.round > 0) {
    parts.push(`第${m.round}輪`);
    if (m.group) parts.push(`${m.group}組`);
  } else if (m.phase) {
    parts.push(m.phase);
  }
  if (m.venue) parts.push(m.venue);
  if (m.city)  parts.push(m.city);
  const infoLine = parts.join(' · ');

  return `
    <div class="${cardClass}">
      <div class="card-teams">
        <div class="team">
          <span class="team-flag">${m.team1.flag}</span>
          <span class="team-name">${m.team1.name || m.team1.code}</span>
        </div>
        <div class="card-center">${centerHtml}</div>
        <div class="team">
          <span class="team-flag">${m.team2.flag}</span>
          <span class="team-name">${m.team2.name || m.team2.code}</span>
        </div>
      </div>
      ${infoLine ? `<div class="card-info">${infoLine}</div>` : ''}
    </div>
  `;
}

// ─── Render: standings overlay ────────────────

async function openOverlay() {
  const overlay = document.getElementById('overlay');
  const grid    = document.getElementById('groups-grid');
  overlay.classList.add('open');
  grid.innerHTML = '<div class="state-msg">載入中…</div>';

  try {
    const groups = await fetchGroups();
    renderGroupsGrid(groups);
  } catch {
    grid.innerHTML = '<div class="state-msg state-error">積分榜載入失敗，請稍後重試</div>';
  }
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('open');
}

function renderGroupsGrid(groups) {
  // Group by letter
  const byGroup = {};
  groups.forEach(entry => {
    const g = entry.group;
    if (!byGroup[g]) byGroup[g] = [];
    byGroup[g].push(entry);
  });

  // Sort teams within each group: pts DESC, gd DESC, gf DESC
  Object.values(byGroup).forEach(arr =>
    arr.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf)
  );

  const groupKeys = Object.keys(byGroup).sort();

  document.getElementById('groups-grid').innerHTML = groupKeys.map(g => `
    <div class="group-card">
      <div class="group-card-title">${g} 組</div>
      <table class="group-table">
        <thead>
          <tr>
            <th>#</th><th>隊伍</th>
            <th>賽</th><th>勝</th><th>平</th><th>負</th><th>球差</th><th>積分</th>
          </tr>
        </thead>
        <tbody>
          ${byGroup[g].map((t, i) => `
            <tr>
              <td class="rank">${i + 1}</td>
              <td>
                <div class="team-cell">
                  <span class="t-flag">${t.team.flag}</span>
                  <span class="t-name">${t.team.name || t.team.code}</span>
                </div>
              </td>
              <td>${t.played}</td>
              <td>${t.win}</td>
              <td>${t.draw}</td>
              <td>${t.loss}</td>
              <td>${t.gd > 0 ? '+' : ''}${t.gd}</td>
              <td class="pts-cell">${t.pts}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `).join('');
}

// ─── Navigation ───────────────────────────────

function shiftWindow(days) {
  windowStart = addDays(windowStart, days);
  renderDateNav();
  notifyHeight();
}

function selectDate(ymd) {
  activeDate = ymd;
  renderDateNav();
  renderMatches();
  startLiveRefresh();
  notifyHeight();
}

// ─── postMessage height ───────────────────────

function notifyHeight() {
  try {
    window.parent.postMessage(
      { type: 'wc2026-resize', height: document.documentElement.scrollHeight },
      '*'
    );
  } catch {}
}

// ─── Init ─────────────────────────────────────

async function init() {
  const app = document.getElementById('app');

  if (!GAS_URL) {
    app.innerHTML = `
      <div class="state-msg state-error">
        資料來源未設定
        <small>請在 wc2026-schedule.html 頂部填入 GAS_URL</small>
      </div>`;
    notifyHeight();
    return;
  }

  app.innerHTML = '<div class="state-msg">載入賽程資料中…</div>';
  notifyHeight();

  try {
    allMatches = await fetchAllMatches(false);
  } catch {
    app.innerHTML = '<div class="state-msg state-error">資料載入失敗，請稍後重試</div>';
    notifyHeight();
    return;
  }

  activeDate = findInitialDate();
  setWindowForDate(activeDate);
  renderShell();
  renderDateNav();
  renderMatches();
  startLiveRefresh();
  notifyHeight();
}

// ─── Event listeners ──────────────────────────

document.addEventListener('DOMContentLoaded', init);

document.getElementById('overlay').addEventListener('click', e => {
  if (!document.getElementById('overlay-panel').contains(e.target)) closeOverlay();
});

document.getElementById('btn-close').addEventListener('click', closeOverlay);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeOverlay();
});
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
