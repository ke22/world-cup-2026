<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA 世界杯 2026 分組積分榜</title>
<style>
/* ── CNA Design System Variables ── */
:root {
  color-scheme: light;
  --bg: #eef2f6;
  --surface: #ffffff;
  --surface-2: #f5f8fc;
  --fg: #1f2937;
  --muted: #66758a;
  --border: rgba(15, 50, 96, 0.12);
  --shadow: rgba(15, 75, 143, 0.08);
  --accent: #0f4b8f;
  --accent-2: #2c73c9;
  --accent-soft: rgba(15, 75, 143, 0.08);
  --header-from: #13579f;
  --header-to: #0f4b8f;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { min-height: -webkit-fill-available; }
body {
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC",
    "Microsoft JhengHei", Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
  font-size: 14px;
  line-height: 1.5;
  min-height: -webkit-fill-available;
}

/* ── Page wrapper ── */
.page {
  max-width: 1200px;
  margin: 0 auto;
  padding: 14px 14px 0;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
.page-header {
  background: linear-gradient(180deg, var(--header-from) 0%, var(--header-to) 100%);
  border-radius: 16px 16px 0 0;
  padding: 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.page-header-title {
  font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 0.2px;
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ── Anchor nav (sticky) ── */
.anchor-nav {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-top: none;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px var(--shadow);
}
.anchor-btn {
  height: 44px; padding: 0 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--accent);
  font-size: 14px; font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.anchor-btn:hover {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* ── Groups container ── */
.groups-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 16px 16px;
  box-shadow: 0 10px 30px var(--shadow);
  padding: 16px;
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* ── Group section ── */
.group-section {
  margin-bottom: 22px;
  scroll-margin-top: 62px; /* anchor-nav sticky height */
}
.group-section:last-child { margin-bottom: 0; }

/* ── Group card ── */
.group-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(15, 75, 143, 0.04);
}
.group-card-title {
  background: var(--surface-2);
  padding: 10px 14px;
  font-size: 18px; font-weight: 800; color: var(--accent);
  letter-spacing: 0.3px;
  border-bottom: 1px solid var(--border);
}

/* ── Group table ── */
.group-table { width: 100%; border-collapse: collapse; }
.group-table th {
  font-size: 12px; font-weight: 700; color: var(--muted);
  text-align: center; padding: 8px 4px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
}
.group-table th.th-team { text-align: left; padding-left: 12px; }
.group-table td {
  font-size: 14px; text-align: center; padding: 10px 4px;
  border-top: 1px solid rgba(15, 50, 96, 0.06);
}
.group-table td.td-team { text-align: left; padding-left: 12px; }
.group-table tbody tr:hover td { background: var(--accent-soft); }

/* ── Team cell ── */
.team-cell { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.t-flag { font-size: 20px; line-height: 1; flex-shrink: 0; }
.t-name { font-size: 16px; font-weight: 700; color: var(--fg); }

/* ── Stats cells ── */
.rank-cell { color: var(--muted); font-size: 13px; font-weight: 600; }
.pts-cell  { font-size: 15px; font-weight: 800; color: var(--accent); }
.gd-cell   { font-size: 14px; font-weight: 600; }
.gd-cell.positive { color: #16a34a; }
.gd-cell.negative { color: #dc2626; }

/* ── State messages ── */
.state-msg {
  text-align: center; padding: 40px 20px;
  font-size: 15px; color: var(--muted);
}
.state-error { color: #c0392b; }

/* ── CNA Logo ── */
.cna-logo { height: 24px; width: auto; filter: brightness(0) invert(1); opacity: 0.9; flex-shrink: 0; }

@media (max-width: 767px) {
  /* anchor nav 單排橫滑 */
  .anchor-nav {
    padding: 5px 12px;
    gap: 4px;
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .anchor-nav::-webkit-scrollbar { display: none; }
  .anchor-btn { height: 32px; font-size: 12px; padding: 0 8px; flex-shrink: 0; }
  .group-section { scroll-margin-top: 42px; }
  /* 手機版：min-height 確保一組完整可見，內部滾軸 */
  .page { min-height: 360px; height: 100svh; }
  .groups-container { min-height: 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>
<body>

<div class="page">
  <header class="page-header">
    <span class="page-header-title">⚽ FIFA 世界杯 2026 分組積分榜</span>
    <img src="cna_logo.svg" class="cna-logo" alt="CNA">
  </header>

  <nav class="anchor-nav" id="anchor-nav" aria-label="跳至組別">
    <!-- Rendered by JS -->
  </nav>

  <div class="groups-container" id="groups-container">
    <div class="state-msg">載入積分資料中…</div>
  </div>
</div>

<script>
const GAS_URL   = 'https://script.google.com/macros/s/AKfycbw6CYUYELg_1hfnuozFtiq2HkyvHzz-O2KPUTkRQ7NOrJqW64tXlWgrM4JiRDR8ZRQDiA/exec';
const CACHE_TTL = 300;

function cacheGet(key) {
  try {
    const raw = sessionStorage.getItem(key);
    if (!raw) return null;
    const { ts, data } = JSON.parse(raw);
    if (Date.now() - ts < CACHE_TTL * 1000) return data;
    sessionStorage.removeItem(key);
    return null;
  } catch { return null; }
}

function cacheSet(key, data) {
  try {
    sessionStorage.setItem(key, JSON.stringify({ ts: Date.now(), data }));
  } catch {}
}

async function fetchGroups() {
  const key = 'wc26_groups';
  const hit = cacheGet(key);
  if (hit) return hit;
  const url = `${GAS_URL}?action=getGroups`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (json.status === 'error') throw new Error(json.message || 'API error');
  cacheSet(key, json.data);
  return json.data;
}

function renderAnchorNav(groupKeys) {
  const nav = document.getElementById('anchor-nav');
  nav.innerHTML = groupKeys.map(g =>
    `<button class="anchor-btn" onclick="scrollToGroup('${g}')" aria-label="跳至 ${g} 組">${g}</button>`
  ).join('');
}

function scrollToGroup(letter) {
  const el = document.getElementById(`group-${letter}`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function gdDisplay(gd) {
  if (gd > 0) return { text: `+${gd}`, cls: 'gd-cell positive' };
  if (gd < 0) return { text: `${gd}`, cls: 'gd-cell negative' };
  return { text: '0', cls: 'gd-cell' };
}

function renderGroups(groups) {
  const byGroup = {};
  groups.forEach(entry => {
    const g = entry.group;
    if (!byGroup[g]) byGroup[g] = [];
    byGroup[g].push(entry);
  });

  // Sort within each group: pts DESC, gd DESC, gf DESC
  Object.values(byGroup).forEach(arr =>
    arr.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf)
  );

  const groupKeys = Object.keys(byGroup).sort();

  renderAnchorNav(groupKeys);

  document.getElementById('groups-container').innerHTML = groupKeys.map(g => {
    const teams = byGroup[g];
    const rows = teams.map((t, i) => {
      const { text: gdText, cls: gdCls } = gdDisplay(t.gd);
      return `
        <tr>
          <td class="rank-cell">${i + 1}</td>
          <td class="td-team">
            <div class="team-cell">
              <span class="t-flag">${t.team.flag}</span>
              <span class="t-name">${t.team.name || t.team.code}</span>
            </div>
          </td>
          <td>${t.played}</td>
          <td>${t.win}</td>
          <td>${t.draw}</td>
          <td>${t.loss}</td>
          <td class="${gdCls}">${gdText}</td>
          <td class="pts-cell">${t.pts}</td>
        </tr>
      `;
    }).join('');

    return `
      <section class="group-section" id="group-${g}">
        <div class="group-card">
          <div class="group-card-title">${g} 組</div>
          <table class="group-table" aria-label="${g} 組積分">
            <thead>
              <tr>
                <th>#</th>
                <th class="th-team">隊伍</th>
                <th title="出賽">賽</th>
                <th title="勝">勝</th>
                <th title="平">平</th>
                <th title="負">負</th>
                <th title="球差">球差</th>
                <th title="積分">積分</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </section>
    `;
  }).join('');
}

function notifyHeight() {
  try {
    window.parent.postMessage(
      { type: 'wc2026-resize', height: document.documentElement.scrollHeight },
      '*'
    );
  } catch {}
}

async function init() {
  if (!GAS_URL) {
    document.getElementById('groups-container').innerHTML =
      '<div class="state-msg state-error">資料來源未設定</div>';
    notifyHeight();
    return;
  }
  try {
    const groups = await fetchGroups();
    renderGroups(groups);
    notifyHeight();
  } catch (err) {
    document.getElementById('groups-container').innerHTML =
      `<div class="state-msg state-error">積分榜載入失敗，請稍後重試</div>`;
    notifyHeight();
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
